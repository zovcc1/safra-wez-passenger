<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="200" cy="200" r="180" fill="#E3E9FF"/>

  <!-- phone body -->
  <g transform="translate(200,215)">
    <rect x="-78" y="-120" width="156" height="230" rx="26" fill="#0F172A"/>
    <rect x="-68" y="-106" width="136" height="198" rx="10" fill="#FFFFFF"/>
    <rect x="-16" y="-116" width="32" height="6" rx="3" fill="#0030FF"/>

    <!-- notification card inside screen -->
    <g transform="translate(0,-70)">
      <rect x="-56" y="-26" width="112" height="52" rx="14" fill="#F1F5F9"/>
      <circle cx="-36" cy="0" r="14" fill="#0030FF"/>
      <path d="M -41 0 a 5 5 0 0 1 5 -5 v 0 a 5 5 0 0 1 5 5 v 4 l 3 3 h -16 l 3 -3 Z" fill="#FFFFFF"/>
      <rect x="-14" y="-9" width="58" height="7" rx="3.5" fill="#CBD5E1"/>
      <rect x="-14" y="4" width="42" height="6" rx="3" fill="#E2E8F0"/>
    </g>

    <!-- second notification card -->
    <g transform="translate(0,-2)">
      <rect x="-56" y="-22" width="112" height="44" rx="12" fill="#F1F5F9"/>
      <circle cx="-36" cy="0" r="11" fill="#0030FF"/>
      <path d="M -40 2 l 5 5 l 9 -11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-16" y="-6" width="50" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="-16" y="4" width="34" height="5" rx="2.5" fill="#E2E8F0"/>
    </g>

    <!-- CTA bar at bottom of screen -->
    <rect x="-56" y="48" width="112" height="14" rx="7" fill="#0030FF"/>
    <rect x="-56" y="70" width="74" height="10" rx="5" fill="#EEF2F6"/>
  </g>

  <!-- bell with sound waves, top right -->
  <g transform="translate(300,95)">
    <circle cx="0" cy="0" r="40" fill="#0030FF"/>
    <path d="M0 -14 a12 12 0 0 1 12 12 v6 c0 6 3 9 6 11 h-36 c3 -2 6 -5 6 -11 v-6 a12 12 0 0 1 12 -12 Z"
          fill="#FFFFFF" transform="translate(0,2)"/>
    <path d="M-5 15 a5 5 0 0 0 10 0 Z" fill="#FFFFFF" transform="translate(0,2)"/>
    <path d="M 18 -10 q 8 10 0 20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M -18 -10 q -8 10 0 20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- notification badge -->
  <circle cx="326" cy="72" r="10" fill="#0F172A"/>
  <circle cx="326" cy="72" r="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- floating dots -->
  <circle cx="70" cy="120" r="6" fill="#0030FF" opacity="0.4"/>
  <circle cx="95" cy="310" r="5" fill="#CBD5E1"/>
  <circle cx="330" cy="300" r="4" fill="#0030FF" opacity="0.4"/>
</svg>
