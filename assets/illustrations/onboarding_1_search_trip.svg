<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="200" cy="200" r="180" fill="#E3E9FF"/>

  <!-- winding road -->
  <path d="M 60 320 C 120 260, 100 200, 160 180 C 220 160, 200 100, 270 80"
        fill="none" stroke="#CBD5E1" stroke-width="26" stroke-linecap="round"/>
  <path d="M 60 320 C 120 260, 100 200, 160 180 C 220 160, 200 100, 270 80"
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>

  <!-- destination pin at end of road -->
  <g transform="translate(270,80)">
    <circle cx="0" cy="0" r="26" fill="#0030FF"/>
    <path d="M0 -10 a10 10 0 1 1 -0.01 0 Z" fill="#FFFFFF"/>
  </g>

  <!-- start marker -->
  <circle cx="60" cy="320" r="10" fill="#0030FF"/>
  <circle cx="60" cy="320" r="16" fill="none" stroke="#0030FF" stroke-width="2" opacity="0.4"/>

  <!-- small bus travelling on the road -->
  <g transform="translate(150,178) rotate(-18)">
    <rect x="-30" y="-16" width="60" height="32" rx="10" fill="#0030FF"/>
    <rect x="-22" y="-9" width="16" height="12" rx="2" fill="#F1F5F9"/>
    <rect x="-2" y="-9" width="16" height="12" rx="2" fill="#F1F5F9"/>
    <circle cx="-16" cy="16" r="7" fill="#0F172A"/>
    <circle cx="14" cy="16" r="7" fill="#0F172A"/>
    <circle cx="-16" cy="16" r="3" fill="#CBD5E1"/>
    <circle cx="14" cy="16" r="3" fill="#CBD5E1"/>
  </g>

  <!-- search magnifier over the map, main focal element -->
  <g transform="translate(215,255)">
    <circle cx="0" cy="0" r="58" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#0030FF" stroke-width="4"/>
    <circle cx="-6" cy="-6" r="30" fill="none" stroke="#0030FF" stroke-width="10"/>
    <line x1="16" y1="16" x2="46" y2="46" stroke="#0030FF" stroke-width="12" stroke-linecap="round"/>
    <path d="M -18 -6 l 8 -14 l 8 14 l -8 8 Z" fill="#0F172A"/>
  </g>

  <!-- floating dots -->
  <circle cx="330" cy="150" r="6" fill="#0030FF" opacity="0.5"/>
  <circle cx="90" cy="120" r="5" fill="#CBD5E1"/>
  <circle cx="320" cy="290" r="4" fill="#0030FF" opacity="0.4"/>
</svg>
