<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="200" cy="200" r="180" fill="#E3E9FF"/>

  <!-- ticket card -->
  <g transform="translate(200,205) rotate(-6)">
    <path d="M -120 -70
             a 14 14 0 0 1 14 -14
             h 212
             a 14 14 0 0 1 14 14
             v 34
             a 16 16 0 0 0 0 32
             v 34
             a 14 14 0 0 1 -14 14
             h -212
             a 14 14 0 0 1 -14 -14
             v -34
             a 16 16 0 0 0 0 -32
             Z"
          fill="#0030FF"/>
    <!-- perforation line -->
    <line x1="-30" y1="-84" x2="-30" y2="94" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 8" opacity="0.5"/>

    <!-- stub: seat icon -->
    <g transform="translate(-75,0)">
      <rect x="-22" y="-24" width="44" height="34" rx="8" fill="#FFFFFF"/>
      <rect x="-22" y="10" width="44" height="12" rx="4" fill="#FFFFFF"/>
      <rect x="-22" y="-24" width="10" height="46" rx="4" fill="#CBD5E1"/>
      <rect x="12" y="-24" width="10" height="46" rx="4" fill="#CBD5E1"/>
    </g>

    <!-- main: booking details lines -->
    <g transform="translate(40,-40)">
      <rect x="-20" y="0" width="130" height="10" rx="5" fill="#FFFFFF"/>
      <rect x="-20" y="20" width="90" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="-20" y="38" width="70" height="8" rx="4" fill="#E2E8F0"/>
    </g>

    <!-- barcode -->
    <g transform="translate(-10,64)">
      <rect x="0" y="0" width="3" height="20" fill="#FFFFFF"/>
      <rect x="6" y="0" width="5" height="20" fill="#FFFFFF"/>
      <rect x="14" y="0" width="2" height="20" fill="#FFFFFF"/>
      <rect x="19" y="0" width="4" height="20" fill="#FFFFFF"/>
      <rect x="27" y="0" width="3" height="20" fill="#FFFFFF"/>
      <rect x="33" y="0" width="6" height="20" fill="#FFFFFF"/>
      <rect x="42" y="0" width="2" height="20" fill="#FFFFFF"/>
      <rect x="47" y="0" width="4" height="20" fill="#FFFFFF"/>
      <rect x="55" y="0" width="3" height="20" fill="#FFFFFF"/>
      <rect x="61" y="0" width="5" height="20" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- checkmark badge floating on top -->
  <g transform="translate(285,120)">
    <circle cx="0" cy="0" r="34" fill="#0F172A"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M -14 0 L -4 12 L 16 -12" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating dots -->
  <circle cx="90" cy="300" r="6" fill="#0030FF" opacity="0.4"/>
  <circle cx="80" cy="110" r="5" fill="#CBD5E1"/>
  <circle cx="330" cy="270" r="4" fill="#0030FF" opacity="0.4"/>
</svg>
